<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasaporte Agrodinámica 2026</title>
    <!-- Implementación rápida de Tailwind para la demo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agro: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Contenedor Principal (Mobile First) -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Cabecera de la App -->
        <div class="bg-agro-700 p-6 text-center text-white relative overflow-hidden">
            <!-- Patrón de fondo sutil (opcional para diseño agrícola) -->
            <div class="absolute inset-0 opacity-10" style="background-image: repeating-linear-gradient(45deg, #000 0, #000 2px, transparent 2px, transparent 8px);"></div>
            
            <div class="relative z-10">
                <h1 class="text-3xl font-bold tracking-tight mb-1">Agrodinámica</h1>
                <p class="text-agro-50 text-sm font-medium uppercase tracking-wider">Edición 2026</p>
            </div>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="p-6">
            <div class="text-center mb-6">
                <h2 class="text-xl font-semibold text-gray-800">Tu Pasaporte Digital</h2>
                <p class="text-sm text-gray-500 mt-1">Regístrate gratis para participar de los sorteos y conectar con expositores.</p>
            </div>

            <form action="#" method="POST" class="space-y-4">
                
                <!-- Campo: Nombre Completo -->
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-agro-500 focus:border-agro-500 transition-colors" required>
                </div>

                <!-- Campo: Ciudad -->
                <div>
                    <label for="ciudad" class="block text-sm font-medium text-gray-700 mb-1">Ciudad de Origen</label>
                    <input type="text" id="ciudad" name="ciudad" placeholder="Ej. Hohenau" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-agro-500 focus:border-agro-500 transition-colors" required>
                </div>

                <!-- Campo: Perfil (Clave para segmentar datos) -->
                <div>
                    <label for="perfil" class="block text-sm font-medium text-gray-700 mb-1">¿Cuál es tu perfil?</label>
                    <div class="relative">
                        <select id="perfil" name="perfil" 
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-agro-500 focus:border-agro-500 appearance-none bg-white transition-colors" required>
                            <option value="" disabled selected>Selecciona una opción...</option>
                            <option value="productor">Productor / Agricultor</option>
                            <option value="estudiante">Estudiante / Académico</option>
                            <option value="empresa">Representante de Empresa</option>
                            <option value="general">Público General</option>
                        </select>
                        <!-- Flecha personalizada para el select -->
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Botón de Acción -->
                <div class="pt-4">
                    <button type="submit" 
                        class="w-full bg-agro-600 hover:bg-agro-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-agro-600/30 transform transition-all active:scale-95 flex justify-center items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                        </svg>
                        Generar mi Pasaporte QR
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer / Branding de la Agencia -->
        <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400 font-medium">
                Plataforma oficial desarrollada por 
                <span class="text-gray-600 font-bold">Soteweb</span>
            </p>
        </div>
    </div>

</body>
</html>
